<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branch office network · Network topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 880px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Network · Diagram Design</p>
    <h1>Branch office network</h1>

    <svg viewBox="0 0 1040 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-title network-desc">
      <title id="network-title">Branch office network</title>
      <desc id="network-desc">Network topology showing a WAN uplink through an edge firewall into a core switch, fanning out to a data VLAN with a file server and a wireless VLAN served by an access point aggregating 42 clients.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn first, before links and devices) -->
      <rect x="600" y="40" width="200" height="140" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="616" y="44" width="168" height="12" fill="#f5f5f5"/>
      <text x="700" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VLAN 10 — DATA — 10.0.10.0/24</text>

      <rect x="600" y="220" width="200" height="140" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="616" y="224" width="176" height="12" fill="#f5f5f5"/>
      <text x="704" y="233" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VLAN 20 — WIFI — 10.0.20.0/24</text>

      <!-- Links (behind devices) -->
      <line x1="176" y1="130" x2="176" y2="180" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="212" x2="360" y2="180" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 456,212 H 520 Q 528,212 528,204 V 128 Q 528,120 536,120 H 592" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 456,244 H 520 Q 528,244 528,252 V 300 Q 528,308 536,308 H 592" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Link labels -->
      <rect x="144" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAN:443</text>

      <rect x="328" y="188" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="360" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRUNK</text>

      <rect x="492" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="161" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1G</text>

      <rect x="492" y="326" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="335" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VLAN 20 TAG</text>

      <!-- Node: internet (external) -->
      <rect x="96" y="44" width="160" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="44" width="160" height="84" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="104" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="120" y="61" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAN</text>
      <text x="176" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Internet</text>
      <text x="176" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ISP uplink</text>

      <!-- Node: edge firewall (focal — security boundary) -->
      <rect x="96" y="180" width="160" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="180" width="160" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="104" y="188" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="116" y="197" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FW</text>
      <text x="176" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">edge-fw-01</text>
      <rect x="104" y="232" width="144" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="112" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">wan0</text>
      <text x="240" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">203.0.113.1</text>

      <!-- Node: core switch -->
      <rect x="280" y="180" width="160" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="180" width="160" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="188" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="300" y="197" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SW</text>
      <text x="360" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">core-sw-01</text>
      <rect x="288" y="232" width="144" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="296" y="248" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">24-port L2/L3</text>
      <text x="424" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">10.0.0.1</text>

      <!-- Node: file server (VLAN 10) -->
      <rect x="624" y="80" width="152" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="80" width="152" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="632" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="646" y="97" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
      <text x="700" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">file-01</text>
      <rect x="632" y="132" width="136" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="640" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">SMB:445</text>
      <text x="760" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">10.0.10.5</text>

      <!-- Node: access point (VLAN 20, aggregated clients) -->
      <rect x="624" y="260" width="152" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="260" width="152" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="632" y="268" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="644" y="277" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AP</text>
      <rect x="732" y="268" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="750" y="277" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">42 cli</text>
      <text x="700" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ap-floor2</text>
      <rect x="632" y="312" width="136" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="640" y="328" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Wi-Fi 6</text>
      <text x="760" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">10.0.20.2</text>

      <!-- Legend strip -->
      <line x1="40" y1="384" x2="1000" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="416" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="60" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Security boundary</text>

      <rect x="220" y="416" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Device</text>

      <rect x="340" y="416" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="360" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Subnet / VLAN</text>

      <line x1="500" y1="420" x2="528" y2="420" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="536" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cross-VLAN link</text>

      <line x1="672" y1="420" x2="700" y2="420" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="708" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">WAN uplink</text>
    </svg>
  </div>
</body>
</html>
